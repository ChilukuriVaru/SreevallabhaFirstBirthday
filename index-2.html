/* Layout: a full-screen story player (tap left/right, progress bars). Each guest circle gets its own world:
   family = kumkum maroon + turmeric gold with muggu dots, Telugu first; close friends = marigold party, Tenglish banter;
   colleagues = annual-report paper, navy ink. Single look per circle by choice, every colour set explicitly. */
:root{
  --bg:#FFB830;--fg:#1B1B3A;--muted:#3D3A55;--eyebrow:#7A1640;--accent:#E23E79;--bar:#1B1B3A;--bar-track:rgba(27,27,58,.22);
  --card:#FFFFFF;--card-fg:#1B1B3A;--card-muted:#4A4766;--card-eyebrow:#7A1640;--card-line:#1B1B3A;
  --btn:#1B1B3A;--frame:#1B1B3A;--ph:#FFD36E;--ph-fg:#3D3A55;--rule:rgba(27,27,58,.25);
  --f-head:'Baloo Tammudu 2',system-ui,sans-serif;--f-body:'Baloo Tammudu 2',system-ui,sans-serif;
  --f-te:'Noto Sans Telugu','Nirmala UI',system-ui,sans-serif;
}
body.t-family{--bg:#5A0F1C;--fg:#FFF7E8;--muted:#F2D9B0;--eyebrow:#E9B949;--accent:#E9B949;--bar:#FFF7E8;--bar-track:rgba(255,247,232,.25);
  --card:#FFF7E8;--card-fg:#4A0C17;--card-muted:#6B4A2E;--card-eyebrow:#8A1C2B;--card-line:#C8961E;
  --btn:#7E1D2E;--frame:#E9B949;--ph:#6E1626;--ph-fg:#F2D9B0;--rule:rgba(233,185,73,.4);
  --f-head:'Playfair Display','Noto Serif Telugu',Georgia,serif;--f-body:'Noto Sans Telugu','Nirmala UI',system-ui,sans-serif;color-scheme:dark}
body.t-office{--bg:#F7F7F4;--fg:#13233F;--muted:#4B5568;--eyebrow:#1F5C46;--accent:#1F5C46;--bar:#13233F;--bar-track:rgba(19,35,63,.18);
  --card:#FFFFFF;--card-fg:#13233F;--card-muted:#4B5568;--card-eyebrow:#1F5C46;--card-line:#D5D8DF;
  --btn:#13233F;--frame:#13233F;--ph:#E7E9EE;--ph-fg:#4B5568;--rule:#D5D8DF;
  --f-head:'IBM Plex Serif',Georgia,serif;--f-body:'IBM Plex Sans',system-ui,sans-serif}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden}
.stage{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg);isolation:isolate}
.decor{position:absolute;inset:0;z-index:0;pointer-events:none}
.t-family .decor{background-image:radial-gradient(circle,rgba(233,185,73,.3) 1.6px,transparent 2.4px);background-size:24px 24px;
  -webkit-mask-image:radial-gradient(ellipse 72% 62% at 50% 50%,transparent 58%,#000 100%);mask-image:radial-gradient(ellipse 72% 62% at 50% 50%,transparent 58%,#000 100%)}
.t-friends .decor{background:radial-gradient(circle at 100% 0%,#FFD36E 0 32%,transparent 32.3%),radial-gradient(circle at 0% 100%,rgba(226,62,121,.3) 0 24%,transparent 24.3%)}

.bars{position:absolute;z-index:5;top:10px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:3px}
.bars span{flex:1;height:3px;border-radius:2px;background:var(--bar-track);overflow:hidden}
.bars i{display:block;height:100%;width:0;background:var(--bar)}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}

.chooser{position:absolute;z-index:6;top:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,20,.78);box-shadow:0 4px 14px rgba(0,0,0,.2);white-space:nowrap}
.chooser span{color:#FFFFFF;opacity:.75;font:600 11px system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase;padding:0 6px 0 8px}
.chooser button{min-height:36px;padding:0 11px;border-radius:999px;border:0;background:transparent;color:#FFFFFF;font:600 13px system-ui,sans-serif;cursor:pointer}
.chooser button[aria-pressed="true"]{background:#FFFFFF;color:#111111}
@media (max-width:380px){.chooser span{display:none}.chooser button{padding:0 9px}}

.slide{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;overflow-y:auto;padding-block:58px 36px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));opacity:0;pointer-events:none;transition:opacity .45s ease}
.has-preview .slide{padding-top:112px}
.slide.on{opacity:1;pointer-events:auto}
.inner{margin-block:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;width:100%}

.eyebrow{font:600 13px/1.35 var(--f-body);letter-spacing:3px;text-transform:uppercase;color:var(--eyebrow)}
h1{margin:0;font-family:var(--f-head);font-weight:700;font-size:clamp(36px,10vw,56px);line-height:1.12;text-wrap:balance;color:var(--fg)}
.h-md{font-size:clamp(26px,7vw,38px)}
.lead{margin:0;font-size:18px;line-height:1.55;color:var(--muted);max-width:32ch}
.te-main{margin:0;font-family:var(--f-te);font-size:20px;line-height:1.65;color:var(--fg);max-width:30ch;text-wrap:balance}
.en-sub{margin:0;font-family:system-ui,sans-serif;font-size:14px;line-height:1.5;color:var(--muted);max-width:34ch}
.tapnote{font-size:13px;color:var(--muted);letter-spacing:1px;margin-top:6px}
.frame{width:min(74vw,340px);aspect-ratio:4/5;max-width:100%;max-height:50vh;border-radius:18px;overflow:hidden;border:3px solid var(--frame);background:var(--ph);display:flex;align-items:center;justify-content:center;flex:none}
.frame img,.frame video{width:100%;height:100%;object-fit:cover;display:block}
/* line drawings: whole drawing on white paper, revealed as if being drawn */
.frame.paper{background:#FFFFFF;padding:10px;box-sizing:border-box;aspect-ratio:auto;max-height:none;width:min(86vw,440px)}
.frame.paper img{height:auto;max-height:42vh;object-fit:contain}
.slide{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.slide.on .frame img.draw{animation:drawin 1.8s cubic-bezier(.3,.6,.3,1) both}
/* shorter phones: tighten the invitation card so it fits without scrolling where possible */
@media (max-height:820px){
  .slide{padding-block:40px 20px}
  .card{gap:9px;padding:18px 16px}
  .card h2{font-size:24px}
  .card .te-main{font-size:16px;line-height:1.5}
  .facts{font-size:15px;line-height:1.35}
  .kv>div{padding:6px 0}
  .notice{font-size:14px;line-height:1.45}
  .agenda ol{font-size:14px;line-height:1.45}
  .btn{min-height:44px}
  .soon{font-size:14px;padding:6px 12px}
  .linkbtn{min-height:36px}
}
[hidden]{display:none!important}
.kv dd .lm{display:block;font-weight:400;font-size:14px;color:var(--card-muted)}
.agenda{margin:0;font-size:14px;line-height:1.45}
.agenda .lbl{margin-right:6px}
.hosts{display:flex;flex-direction:column;gap:1px;font-size:14px;line-height:1.45;color:var(--card-muted);text-align:center;align-self:stretch}
.hosts .lbl{font-weight:700;color:var(--card-eyebrow);letter-spacing:.5px}
.hosts .akka{font-weight:700;color:var(--card-fg);margin-top:2px}
.soon{font:700 15px/1.2 var(--f-body);letter-spacing:.5px;padding:8px 14px;border-radius:999px;background:var(--btn);color:var(--card);align-self:center}
.frame.mystery{border-style:dashed}
.frame.mystery .ph{gap:10px;font-weight:600;letter-spacing:1px}
.frame.mystery .ph b{font-size:130px}
.slide.on .frame.mystery .ph b{animation:peek 1.6s ease-in-out infinite}
@keyframes peek{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.08)}}
@media (prefers-reduced-motion: reduce){.slide.on .frame.mystery .ph b{animation:none}}
@keyframes drawin{from{clip-path:inset(0 100% 0 0);opacity:.35}to{clip-path:inset(0 0 0 0);opacity:1}}
@media (prefers-reduced-motion: reduce){.slide.on .frame img.draw{animation:none}}
.ph{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ph-fg);font-size:14px}
.ph b{font-family:var(--f-head);font-size:64px;line-height:1;color:var(--frame)}
.mlabel{font-family:var(--f-head);font-style:italic;font-size:20px;color:var(--eyebrow)}
.cap{margin:0;font-size:19px;line-height:1.45;max-width:28ch;color:var(--fg)}
.big1{font-family:var(--f-head);font-size:150px;line-height:.9;font-weight:800;color:var(--eyebrow)}

/* family */
.t-family .eyebrow{letter-spacing:0;text-transform:none;font-size:15px}
.t-family h1{line-height:1.32}
.t-family .mlabel{font-style:normal;font-family:var(--f-te);font-weight:600}
.t-family .memory{font-family:'Playfair Display','Noto Serif Telugu',Georgia,serif;font-style:italic;font-weight:500}
/* friends */
.t-friends h1{font-weight:800;letter-spacing:-.5px;line-height:1.05}
.t-friends .frame{transform:rotate(-2deg);box-shadow:8px 8px 0 var(--fg);border-radius:20px}
.t-friends .cap{font-weight:600;font-size:21px}
.t-friends .big1{color:var(--fg);text-shadow:8px 8px 0 var(--accent)}
/* office */
.t-office .inner{align-items:stretch;text-align:left;max-width:420px;margin-inline:auto}
.t-office .frame{align-self:center;border-radius:2px;border-width:1px;box-shadow:0 14px 30px rgba(19,35,63,.15)}
.t-office .cap{align-self:center;text-align:center;font-style:italic;font-family:var(--f-head)}
.t-office .eyebrow{font-size:12px;letter-spacing:2px}
.sub{margin:0;font-family:var(--f-head);font-style:italic;font-size:20px;color:var(--muted)}
.rule{border:0;border-top:1px solid var(--rule);width:100%;margin:2px 0}
.kv{margin:0;width:100%}
.kv>div{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.kv dt{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;font-weight:600;font-size:16px;line-height:1.4;color:var(--fg);font-variant-numeric:tabular-nums}
.kv dd.good{color:var(--accent)}
.risks{margin:0;padding-left:1.1em;display:grid;gap:12px;font-size:18px;line-height:1.45}

/* invitation card */
.card{background:var(--card);color:var(--card-fg);width:min(100%,400px);box-sizing:border-box;padding:26px 20px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;margin-inline:auto}
.t-family .card{border-radius:18px;box-shadow:0 0 0 1px var(--card-line),0 0 0 7px var(--card),0 0 0 8px var(--card-line)}
.t-friends .card{border-radius:22px;border:3px solid var(--card-line);box-shadow:8px 8px 0 var(--card-line)}
.t-office .card{border-radius:0;border-top:5px solid var(--btn);box-shadow:0 1px 0 var(--card-line),0 12px 30px rgba(19,35,63,.12);text-align:left;align-items:stretch;width:min(100%,420px)}
.card .eyebrow{color:var(--card-eyebrow)}
.card h2{margin:0;font-family:var(--f-head);font-size:30px;line-height:1.25;color:var(--card-fg);text-wrap:balance}
.t-friends .card h2{font-weight:800;font-size:32px}
.card .te-main{color:var(--card-fg);font-size:18px}
.card .en-sub{color:var(--card-muted)}
.card .kv dt{color:var(--card-muted)}
.card .kv dd{color:var(--card-fg)}
.card .kv>div{border-color:var(--card-line)}
.facts{display:grid;gap:3px;font-size:16px;line-height:1.45}
.facts .te{font-family:var(--f-te)}
.notice{margin:0;font-size:15px;line-height:1.55}
.agenda .lbl{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--card-muted)}
.agenda ol{margin:4px 0 0;padding-left:1.3em;line-height:1.6;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.btn{font:600 15px/1.1 var(--f-body);min-height:46px;padding:0 16px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;border:1.5px solid var(--btn);color:var(--btn);background:transparent;cursor:pointer;box-sizing:border-box}
.t-office .btn{border-radius:4px}
.btn.solid{background:#1E7A4C;border-color:#1E7A4C;color:#FFFFFF;width:100%}
.small{margin:0;font-size:13px;color:var(--card-muted)}
.linkbtn{background:none;border:0;color:var(--card-muted);font:600 13px var(--f-body);min-height:40px;cursor:pointer;text-decoration:underline;align-self:center}

/* screen-reader / keyboard prev-next only; taps are handled on the stage so swipes can scroll */
.nav{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);border:0;padding:0}
.nav:focus-visible{width:auto;height:auto;clip:auto;z-index:7;top:50%;padding:8px 12px;background:var(--card);color:var(--card-fg)}
.nav.l{left:8px}.nav.r{right:8px}
button:focus-visible,a:focus-visible{outline:2px solid var(--eyebrow);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.slide{transition:none}}
</style>

// "How soon is it?" line on the invitation card, counted in IST so it stays right wherever the guest opens it.
const daysLeft=(()=>{const ist=new Date(Date.now()+5.5*3600e3).toISOString().slice(0,10);return Math.round((Date.parse(EVENT.partyDate)-Date.parse(ist))/864e5)})();
const soon=c=>{const d=daysLeft;
  const T={family:["ఈరోజే!","రేపే!","ఎల్లుండే!",`ఇంకా ${d} రోజులే!`],friends:["It's TODAY!","It's TOMORROW!","Day after tomorrow!",`Only ${d} days to go!`],office:["Today","Tomorrow","Day after tomorrow",`In ${d} days`]}[c];
  if(d<0)return "";return `<div class="soon">⏰ ${d<=2?T[d]:T[3]}</div>`};
const wa=t=>`https://wa.me/${/^\d{10,15}$/.test(EVENT.whatsapp)?EVENT.whatsapp:""}?text=${encodeURIComponent(t)}`;
let CIRCLE="friends";
// Clips load only when their slide is current or next, so guests on mobile data don't download all twelve at once.
const frame=i=>{const still=DRAWINGS[i]||PHOTOS[i]||null,clip=CLIPS[i],alt=`Srivallabha, month ${i+1}`;
  if(clip)return `<div class="frame"><video data-src="${clip}"${still?` poster="${still}"`:""} muted playsinline preload="none" aria-label="${alt}"></video></div>`;
  if(DRAWINGS[i])return `<div class="frame paper"><img class="draw" src="${DRAWINGS[i]}" alt="${alt}"></div>`;
  if(still)return `<div class="frame"><img src="${still}" alt="${alt}"></div>`;

const BUILD={family,friends,office};
const RSVP={
  family:"శివా, శ్రీవల్లభ పుట్టినరోజుకి కుటుంబ సమేతంగా తప్పకుండా వస్తున్నాం!",
  friends:"Hey Siva! Count us in for Srivallabha's party, whole family coming!",
  office:"Hi Siva, happy to confirm attendance at Srivallabha's first AGM, along with family. See you on Wednesday."
};

/* ---------- story player ---------- */
const stage=document.getElementById("stage"),slidesEl=document.getElementById("slides"),barsEl=document.getElementById("bars");
const prevB=document.getElementById("prev"),nextB=document.getElementById("next"),chooser=document.getElementById("chooser");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let slides=[],fills=[],cur=0,t0=performance.now(),elapsed=0,paused=false;

function load(g,c){
  CIRCLE=c;document.body.className="t-"+c;
  slidesEl.innerHTML=BUILD[c]({name:"",memory:"",ask:""}).join("");
  slides=[...slidesEl.querySelectorAll(".slide")];
  barsEl.innerHTML=slides.map(()=>"<span><i></i></span>").join("");
  fills=[...barsEl.querySelectorAll("i")];
  // reading a long slide: scrolling restarts its timer so it doesn't move on mid-read
  slides.forEach(s=>s.addEventListener("scroll",()=>{if(s===slides[cur])elapsed=0},{passive:true}));
  const fin=slides[slides.length-1];
  fin.querySelector(".rsvp").href=wa(RSVP[c]);
  fin.querySelector(".replay").onclick=()=>show(0);
  show(0);
}
function show(i){
  cur=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,k)=>{s.classList.toggle("on",k===cur);if(k===cur)s.scrollTop=0});
  fills.forEach((f,k)=>f.style.width=k<cur?"100%":"0");
  const last=cur===slides.length-1;
  prevB.hidden=last;nextB.hidden=last;
  if(last)fills[cur].style.width="100%";
  elapsed=0;t0=performance.now();
  if(slides[cur].classList.contains("confetti"))burst();
  slides.forEach((s,k)=>s.querySelectorAll("video").forEach(v=>{
    if((k===cur||k===cur+1)&&!v.src&&v.dataset.src){v.src=v.dataset.src;v.load()}
    if(k===cur){v.currentTime=0;v.play().catch(()=>{})}else v.pause();
  }));
}
function tick(now){
  const d=+slides[cur]?.dataset.dur,v=slides[cur]?.querySelector("video[src]");
  if(v&&!v.error){ // a clip sets its own pace: the bar follows the video, and the story moves on when it ends
    if(v.duration)fills[cur].style.width=(v.currentTime/v.duration*100)+"%";
    if(v.ended&&!paused)show(cur+1);
  }else if(d&&!paused&&!reduce){elapsed+=now-t0;const p=Math.min(1,elapsed/d);fills[cur].style.width=(p*100)+"%";if(p>=1)show(cur+1)}
  t0=now;requestAnimationFrame(tick);
}
nextB.onclick=()=>show(cur+1);
prevB.onclick=()=>show(cur-1);
// Tap left third = back, elsewhere = next. A tap, not an overlay, so long slides still scroll with a swipe.
stage.addEventListener("click",e=>{
  if(e.target.closest("a,button,.card,.chooser"))return;
  const r=stage.getBoundingClientRect();
  (e.clientX-r.left<r.width*.33)?show(cur-1):show(cur+1);
});
stage.addEventListener("pointerdown",()=>paused=true);
["pointerup","pointercancel","pointerleave"].forEach(e=>stage.addEventListener(e,()=>paused=false));
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")show(cur+1);if(e.key==="ArrowLeft")show(cur-1)});

/* ---------- confetti (close friends) ---------- */
const fx=document.getElementById("fx"),ctx=fx.getContext("2d");let parts=[],fxOn=false;
function burst(){
  if(reduce)return;
  const dpr=window.devicePixelRatio||1;fx.width=fx.clientWidth*dpr;fx.height=fx.clientHeight*dpr;
  const cols=["#E23E79","#1B1B3A","#FFFFFF","#2EC4B6"];
  for(let k=0;k<110;k++)parts.push({x:Math.random()*fx.width,y:-Math.random()*fx.height*.35,vx:(Math.random()-.5)*2*dpr,vy:(2+Math.random()*3)*dpr,r:(3+Math.random()*4)*dpr,a:Math.random()*6.28,va:(Math.random()-.5)*.3,c:cols[k%4],g:.03*dpr});
  if(!fxOn){fxOn=true;requestAnimationFrame(stepFx)}
}
function stepFx(){
  ctx.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.y<fx.height+40);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()}
  if(parts.length)requestAnimationFrame(stepFx);else{fxOn=false;ctx.clearRect(0,0,fx.width,fx.height)}
}

/* ---------- start ---------- */
const token=(location.hash||"").slice(1).toLowerCase();
if(BUILD[token]){load(null,token)}
else if(PREVIEW){
  stage.classList.add("has-preview");chooser.hidden=false;
  const pick=c=>{chooser.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.c===c)));load(null,c)};
  chooser.querySelectorAll("button").forEach(b=>b.onclick=e=>{e.stopPropagation();pick(b.dataset.c)});
  pick("family");
}else load(null,"family");
requestAnimationFrame(tick);
</script>
